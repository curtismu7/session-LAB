# OrbStack:  HOST_PORT=6880 docker compose up --build -d   ->  http://127.0.0.1:6880
# The server binds 0.0.0.0 INSIDE the container (SESSIONLAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 6880-6899.
name: session-lab

services:
  session-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-6880}:6880"
    environment:
      PORT: "6880"
      SESSIONLAB_BIND: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6880/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
