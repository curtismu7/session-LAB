name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# GitHub-hosted runners only (ubuntu-latest, Node 26).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      # The vendored shared stylesheet must match the hash pinned when it was last re-vendored.
      - run: bash scripts/check-ui-standard.sh
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: PORT=6899 npm run doctor
  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history and tree (counts only, the list is never printed)
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          list="$RUNNER_TEMP/forbidden.txt"
          printf '%s\n' "$FORBIDDEN_STRINGS" | grep -v '^$' > "$list" || true
          test -s "$list" || { echo "FORBIDDEN_STRINGS secret is empty"; exit 1; }
          hist=$(git log -p --all | grep -cF -f "$list" || true)
          tree=$(git grep -l -F -f "$list" -- . || true)
          tree_count=$(printf '%s' "$tree" | grep -c . || true)
          echo "history hits: $hist"
          echo "tree files with hits: $tree_count"
          test "$hist" = "0" && test "$tree_count" = "0"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.18.4
          curl -sSLO "$base/gitleaks_8.18.4_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_8.18.4_checksums.txt"
          grep ' gitleaks_8.18.4_linux_x64.tar.gz$' gitleaks_8.18.4_checksums.txt | sha256sum -c -
          tar -xz -f gitleaks_8.18.4_linux_x64.tar.gz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner
  browser:
    # Drives the real UI (cookie, four admin changes, diagram, 375px) against the built app on a spare port.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-chromium-${{ runner.os }}
      # Run 41207830794 hung for 11+ minutes here: the chromium download reaches 100% and then playwright 1.49.1's installer never
      # exits on Node 26. A current playwright installs cleanly. No --with-deps (apt): the runner image has chromium's libraries.
      - name: install Playwright outside the repo
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i playwright@1.64.1 && npx playwright install chromium
      - name: e2e
        timeout-minutes: 5
        run: |
          PORT=6898 node server/src/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:6898/api/health >/dev/null && { ready=1; break; }; sleep 1; done
          [ "$ready" = 1 ] || { echo "server did not start"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          E2E_URL=http://127.0.0.1:6898/ PLAYWRIGHT_DIR="$RUNNER_TEMP/pw" E2E_SHOTS="$RUNNER_TEMP" node e2e/session-lab.e2e.mjs
